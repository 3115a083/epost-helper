plugins {
    id 'com.android.application'
}
android {
    namespace 'de.eposthelper.app'
    compileSdk 35
    defaultConfig {
        applicationId 'de.eposthelper.app'
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName '0.5.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES','META-INF/NOTICE','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE.txt']
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.mwiede:jsch:0.2.24'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
