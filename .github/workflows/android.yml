name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon --stacktrace test lint assembleDebug
      - name: Print lint errors
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          path=pathlib.Path("app/build/reports/lint-results-debug.xml")
          if path.exists():
              for issue in ET.parse(path).getroot().findall("issue"):
                  if issue.get("severity") in ("Error","Fatal"):
                      print(issue.get("id")+": "+issue.get("message",""))
                      for location in issue.findall("location"):
                          print(location.attrib)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epost-helper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
